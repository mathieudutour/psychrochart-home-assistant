<!doctype html>
<html lang="en" data-theme="default-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Psychrochart preview</title>
    <style>
      /* Home Assistant's default theme: the variables the card relies on. */
      :root {
        --ha-font-size-s: 12px;
        --ha-font-size-l: 16px;
        --ha-font-size-3xl: 28px;
        --ha-font-weight-normal: 400;
        --ha-font-weight-medium: 500;
        --ha-line-height-condensed: 1.2;
        --green-color: #4caf50;
        --blue-color: #2196f3;
        --red-color: #f44336;
      }
      :root,
      :root[data-theme="default-dark"] {
        --primary-background-color: #111111;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(225, 225, 225, 0.12);
      }
      :root[data-theme="default-light"] {
        --primary-background-color: #fafafa;
        --card-background-color: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --divider-color: rgba(0, 0, 0, 0.12);
      }
      /*
       * The Rounded theme (community.home-assistant.io/t/543043), with the
       * psychrochart variables from the README that give it its look.
       */
      :root[data-theme^="rounded"] {
        --ha-card-border-radius: 24px;
        --ha-card-border-width: 0px;
        --green-color: rgb(206, 245, 149);
        --blue-color: rgb(144, 191, 255);
        --red-color: rgb(255, 145, 138);
        --psychrochart-value-font-size: 2.4em;
        --psychrochart-value-font-weight: 300;
        --psychrochart-unit-font-size: 1.4em;
        --psychrochart-readout-padding: 1em 16px 0;
      }
      :root[data-theme="rounded-dark"] {
        --primary-background-color: #000000;
        --card-background-color: #111318;
        --primary-text-color: #ffffff;
        --secondary-text-color: #636774;
        --divider-color: #171a21;
        --psychrochart-unit-color: #a4a9b6;
      }
      :root[data-theme="rounded-light"] {
        --primary-background-color: #ffffff;
        --card-background-color: #f4f6fb;
        --primary-text-color: #000000;
        --secondary-text-color: #969aa6;
        --divider-color: #eaedf6;
        --psychrochart-unit-color: #535865;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        max-width: 960px;
        margin: 0 auto 24px;
        font-size: 14px;
      }
      header .title {
        margin-right: auto;
      }
      header h1 {
        font-size: 18px;
        font-weight: 500;
        margin: 0;
      }
      header p {
        margin: 4px 0 0;
        color: var(--secondary-text-color);
      }
      header a {
        color: inherit;
      }
      #status {
        width: 100%;
        color: var(--secondary-text-color);
        font-variant-numeric: tabular-nums;
      }
      select,
      button {
        font: inherit;
        color: inherit;
        background: var(--card-background-color);
        border: 1px solid var(--divider-color);
        border-radius: 8px;
        padding: 4px 10px;
      }
      button {
        cursor: pointer;
      }
      main {
        display: grid;
        gap: 16px;
        max-width: 960px;
        margin: 0 auto;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        align-items: start;
      }
      @media (max-width: 720px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .label {
        color: var(--secondary-text-color);
        font-size: 12px;
        margin-bottom: 6px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--primary-text-color);
        color: var(--card-background-color);
        font-size: 14px;
      }
      /* A sections-view grid cell: 3 rows of 56 px with 8 px gaps. */
      .grid-cell {
        height: 184px;
      }
      /* Stand-in for Home Assistant's <ha-card>. */
      ha-card {
        display: block;
        position: relative;
        overflow: hidden;
        background: var(--ha-card-background, var(--card-background-color));
        color: var(--primary-text-color);
        border: var(--ha-card-border-width, 1px) solid
          var(--ha-card-border-color, var(--divider-color));
        border-radius: var(--ha-card-border-radius, 12px);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Psychrochart preview</h1>
        <p>
          The real card with a simulated Home Assistant and sensors.
          <a href="https://github.com/mathieudutour/psychrochart-home-assistant">Source and installation</a>
        </p>
      </div>
      <label>Theme
        <select id="theme">
          <option value="default-dark">Default, dark</option>
          <option value="default-light">Default, light</option>
          <option value="rounded-dark">Rounded, dark</option>
          <option value="rounded-light">Rounded, light</option>
        </select>
      </label>
      <label>Name
        <select id="name">
          <option value="">None</option>
          <option>Living room</option>
        </select>
      </label>
      <label>Hours
        <select id="hours">
          <option>6</option>
          <option>24</option>
          <option>72</option>
        </select>
      </label>
      <label>Indoor unit
        <select id="unit">
          <option>°C</option>
          <option>°F</option>
        </select>
      </label>
      <label>Outdoor 30-day mean
        <select id="outdoor">
          <option value="none">No sensor (19 °C default)</option>
          <option value="nostats">Sensor without statistics</option>
          <option value="2">2 °C</option>
          <option value="19" selected>19 °C</option>
          <option value="28">28 °C</option>
        </select>
      </label>
      <label>Pressure
        <select id="pressure">
          <option value="elevation">From elevation</option>
          <option value="1013.25 hPa">Sensor: 1013.25 hPa</option>
          <option value="845.6 hPa">Sensor: 845.6 hPa</option>
          <option value="29.92 inHg">Sensor: 29.92 inHg</option>
        </select>
      </label>
      <label>Elevation
        <select id="elevation">
          <option value="0">0 m</option>
          <option value="500">500 m</option>
          <option value="1500">1500 m</option>
        </select>
      </label>
      <button id="unknown" type="button">Push “unknown”</button>
      <button id="reconnect" type="button">Simulate reconnect</button>
      <div id="status"></div>
    </header>
    <main>
      <div>
        <div class="label">Wide column</div>
        <div data-card></div>
      </div>
      <div>
        <div class="label">Narrow column</div>
        <div data-card></div>
      </div>
      <div>
        <div class="label">Sections view, 12 × 3 cells (184 px)</div>
        <div class="grid-cell" data-card></div>
      </div>
    </main>
    <div id="toast" role="status" hidden></div>
    <script src="preview.js"></script>
  </body>
</html>
